<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#334155" stroke-width="8" />
  
  <!-- Matching Connection Beam -->
  <path d="M 160 256 Q 256 160 352 256 Q 256 352 160 256" fill="none" stroke="url(#beam-grad)" stroke-width="12" filter="url(#glow)" />
  <line x1="160" y1="256" x2="352" y2="256" stroke="url(#primary-grad)" stroke-width="14" stroke-dasharray="16 12" />

  <!-- Center Match Node -->
  <circle cx="256" cy="256" r="64" fill="#0f172a" stroke="url(#primary-grad)" stroke-width="12" filter="url(#glow)" />
  <polygon points="256,216 268,244 296,256 268,268 256,296 244,268 216,256 244,244" fill="#38bdf8" />

  <!-- Left User Node -->
  <circle cx="160" cy="256" r="44" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="160" cy="256" r="24" fill="#0f172a" />
  
  <!-- Right User Node -->
  <circle cx="352" cy="256" r="44" fill="#a855f7" filter="url(#glow)" />
  <circle cx="352" cy="256" r="24" fill="#0f172a" />
</svg>
